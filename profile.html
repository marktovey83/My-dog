<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your dog · Smart Hazel Designs</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="profile-page">
  <div class="wrap profile-wrap">
    <div class="logo-lockup" aria-label="Smart Hazel Designs by Smarty and Hazel">
      <svg class="logo-mark" viewBox="0 0 64 64" width="54" height="54" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#c4a574"/>
        <path d="M20 36c6-14 18-14 24 0-4-6-8-8-12-8s-8 2-12 8z" fill="#8b5e3c"/>
        <path d="M32 22c2 6 8 10 8 16 0 6-4 10-8 10s-8-4-8-10c0-6 6-10 8-16z" fill="#f6f0e6"/>
      </svg>
      <div>
        <div class="logo-name">Smart Hazel</div>
        <div class="logo-sub">Designs</div>
        <div class="logo-by">by Smarty and Hazel</div>
      </div>
    </div>

    <label class="breed-label" for="breed">Choose your breed</label>
    <div class="picker">
      <select id="breed">
        <option value="">Select a breed</option>
        <option value="french-bulldog">French Bulldog</option>
        <option value="labrador">Labrador Retriever</option>
        <option value="golden-retriever">Golden Retriever</option>
        <option value="german-shepherd">German Shepherd</option>
        <option value="poodle">Poodle</option>
        <option value="bulldog">Bulldog</option>
        <option value="beagle">Beagle</option>
        <option value="rottweiler">Rottweiler</option>
        <option value="german-shorthaired-pointer">German Shorthaired Pointer</option>
        <option value="dachshund">Dachshund</option>
        <option value="corgi">Pembroke Welsh Corgi</option>
        <option value="australian-shepherd">Australian Shepherd</option>
        <option value="yorkshire-terrier">Yorkshire Terrier</option>
        <option value="cavalier">Cavalier King Charles Spaniel</option>
        <option value="doberman">Doberman Pinscher</option>
        <option value="boxer">Boxer</option>
        <option value="miniature-schnauzer">Miniature Schnauzer</option>
        <option value="border-collie">Border Collie</option>
        <option value="siberian-husky">Siberian Husky</option>
        <option value="shih-tzu">Shih Tzu</option>
      </select>
      <div class="preview" id="preview" hidden>
        <img id="preview-img" alt="Matching family pyjamas" />
      </div>
    </div>

    <a class="btn enter" href="index.html">Enter the site</a>
  </div>

  <script>
    window.BREED_IMGS = window.BREED_IMGS || {};
    window._BP = window._BP || {};
    const select = document.getElementById("breed");
    const preview = document.getElementById("preview");
    const img = document.getElementById("preview-img");
    const saved = localStorage.getItem("shd-breed");
    if (saved) select.value = saved;

    function assembled(key) {
      const parts = (window._BP[key] || []).filter(Boolean);
      if (parts.length) {
        const uri = parts.join("");
        if (uri.indexOf("data:image") === 0 && uri.length > 200) {
          window.BREED_IMGS[key] = uri;
          return true;
        }
      }
      const single = window.BREED_IMGS[key];
      return !!(single && single.indexOf("data:image") === 0 && single.length > 200);
    }
    function apply(key) {
      if (!assembled(key)) return false;
      img.src = window.BREED_IMGS[key];
      preview.hidden = false;
      return true;
    }
    function loadScript(src) {
      return new Promise(function (resolve) {
        const s = document.createElement("script");
        s.src = src + "?v=2";
        s.onload = function () { resolve(true); };
        s.onerror = function () { resolve(false); };
        document.body.appendChild(s);
      });
    }
    async function load(key) {
      if (!key) { preview.hidden = true; return; }
      if (apply(key)) return;
      await Promise.all([1,2,3,4].map(function (n) {
        return loadScript("js/" + key + "-" + n + ".js");
      }));
      if (apply(key)) return;
      await loadScript("js/" + key + ".js");
      apply(key);
    }
    function show() {
      const key = select.value;
      localStorage.setItem("shd-breed", key);
      load(key);
    }
    select.addEventListener("change", show);
    show();
  </script>
</body>
</html>
